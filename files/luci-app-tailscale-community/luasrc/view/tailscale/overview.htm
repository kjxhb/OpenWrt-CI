<% if not cbid then %>
<style type="text/css">
#cbi-tailscale-settings-_devices_panel .cbi-value-title { display: none; }
#cbi-tailscale-settings-_devices_panel .cbi-value-field { margin-left: 0; }
#cbi-tailscale-settings-enabled .cbi-value-field,
#cbi-tailscale-settings-accept_routes .cbi-value-field,
#cbi-tailscale-settings-advertise_exit_node .cbi-value-field,
#cbi-tailscale-settings-exit_node_allow_lan_access .cbi-value-field,
#cbi-tailscale-settings-runwebclient .cbi-value-field,
#cbi-tailscale-settings-nosnat .cbi-value-field,
#cbi-tailscale-settings-shields_up .cbi-value-field,
#cbi-tailscale-settings-ssh .cbi-value-field,
#cbi-tailscale-settings-disable_magic_dns .cbi-value-field,
#cbi-tailscale-settings-_setup_firewall .cbi-value-field,
#cbi-tailscale-settings-_help_title .cbi-value-field { min-width: 328px; }
#ts_status_section .ts-status-line { padding: 10px 12px; line-height: 1.6; }
</style>

<div class="cbi-section" id="ts_status_section">
	<p id="service_status_display"><%=translate("Collecting data ...")%></p>
	<div id="login_url_display"></div>
</div>

<script type="text/javascript">//<![CDATA[
(function () {
	var URL_STATUS = '<%=luci.dispatcher.build_url("admin", "vpn", "tailscale", "status")%>';
	var URL_FW     = '<%=luci.dispatcher.build_url("admin", "vpn", "tailscale", "setup_firewall")%>';
	var CELL = ' style="padding-right:20px"';

	var T = {
		collecting: '<%=translate("Collecting data ...")%>',
		serviceStatus: '<%=translate("Service Status")%>',
		notFound: '<%=translate("TAILSCALE NOT FOUND")%>',
		loggedOutTs: '<%=translate("Tailscale logged out")%>',
		logoutHint: '<%=translate("Please use the login button in the settings below to authenticate.")%>',
		notRunningTs: '<%=translate("Tailscale not running")%>',
		startingTs: '<%=translate("Tailscale starting")%>',
		running: '<%=translate("RUNNING")%>',
		version: '<%=translate("Version")%>',
		tunMode: '<%=translate("TUN Mode")%>',
		enabled: '<%=translate("Enabled")%>',
		disabled: '<%=translate("Disabled")%>',
		ipv4: '<%=translate("Tailscale IPv4")%>',
		ipv6: '<%=translate("Tailscale IPv6")%>',
		tailnet: '<%=translate("Tailnet Name")%>',
		devices: '<%=translate("Network Devices")%>',
		noPeers: '<%=translate("No peer devices found.")%>',
		noDevices: '<%=translate("No network devices.")%>',
		status: '<%=translate("Status")%>',
		hostname: '<%=translate("Hostname")%>',
		tsip: '<%=translate("Tailscale IP")%>',
		os: '<%=translate("OS")%>',
		conn: '<%=translate("Connection Info")%>',
		rx: '<%=translate("RX")%>',
		tx: '<%=translate("TX")%>',
		lastSeen: '<%=translate("Last Seen")%>',
		online: '<%=translate("Online")%>',
		offline: '<%=translate("Offline")%>',
		exitNode: '<%=translate("Exit Node")%>',
		na: '<%=translate("N/A")%>'
	};

	var regionCodeMap = {};

	function esc(s) {
		if (s == null) return '';
		return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
			.replace(/>/g, '&gt;').replace(/"/g, '&quot;');
	}

	function formatBytes(bytes) {
		var n = parseInt(bytes, 10);
		if (isNaN(n) || n === 0) return '-';
		var k = 1000, sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
		var i = Math.floor(Math.log(n) / Math.log(k));
		return parseFloat((n / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
	}

	function formatLastSeen(d) {
		if (!d) return T.na;
		if (d === '0001-01-01T00:00:00Z') return '<%=translate("Now")%>';
		var t = new Date(d);
		if (isNaN(t.getTime())) return T.na;
		var diff = (Date.now() - t.getTime()) / 1000;
		if (diff < 60) return '<%=translate("Just now")%>';
		return t.toISOString().slice(0, 10);
	}

	function initRegionMap() {
		try {
			fetch('https://controlplane.tailscale.com/derpmap/default')
				.then(function (r) { return r.ok ? r.json() : null; })
				.then(function (data) {
					if (!data || !data.Regions) return;
					for (var id in data.Regions) {
						var region = data.Regions[id];
						var code = (region.RegionCode || '').toLowerCase();
						regionCodeMap[code] = region.RegionName || region.RegionCode || id;
					}
				})
				.catch(function () {});
		} catch (e) {}
	}

	function formatConnectionInfo(info) {
		if (!info) return '-';
		if (typeof info === 'string' && info.length === 3) {
			return regionCodeMap[info.toLowerCase()] || info;
		}
		return info;
	}

	function simpleStatus(label, color, strong, extra) {
		var html = '<dl class="cbi-value ts-status-line">';
		if (label) html += '<dt>' + label + '</dt>';
		html += '<dd><span style="color:' + color + '"><strong>' + strong + '</strong></span>';
		if (extra) html += '<br><span>' + extra + '</span>';
		return html + '</dd></dl>';
	}

	function renderStatus(status) {
		if (!status || !status.hasOwnProperty('status')) {
			return '<em>' + T.collecting + '</em>';
		}
		if (status.status === 'not_installed') {
			return simpleStatus(T.serviceStatus, 'red', T.notFound);
		}
		if (status.status === 'logout') {
			var extra = T.logoutHint;
			if (status.auth_url) {
				extra += '<br><%=translate("Login URL")%>: ' +
					'<a href="' + esc(status.auth_url) + '" target="_blank">' + esc(status.auth_url) + '</a>';
			}
			return simpleStatus('', 'orange', T.loggedOutTs, extra);
		}
		if (status.status === 'starting') {
			return simpleStatus('', 'blue', T.startingTs);
		}
		if (status.status !== 'running') {
			return simpleStatus('', 'red', T.notRunningTs);
		}

		var rows = [
			[T.serviceStatus, '<span style="color:green"><strong>' + T.running + '</strong></span>'],
			[T.version, esc(status.version) || T.na],
			[T.tunMode, status.TUNMode ? T.enabled : T.disabled],
			[T.ipv4, esc(status.ipv4) || T.na],
			[T.ipv6, esc(status.ipv6) || T.na],
			[T.tailnet, esc(status.domain_name) || T.na]
		];
		var html = '<table style="width:100%;border-spacing:0 5px">';
		html += '<tr>' + rows.map(function (r) {
			return '<td' + CELL + '><strong>' + r[0] + '</strong></td>';
		}).join('') + '</tr>';
		html += '<tr>' + rows.map(function (r) {
			return '<td' + CELL + '>' + r[1] + '</td>';
		}).join('') + '</tr></table>';
		return html;
	}

	function renderDevices(status) {
		if (!status || status.status !== 'running') {
			return T.noDevices;
		}
		var peers = status.peers || [];
		if (peers.length === 0) {
			return '<p>' + T.noPeers + '</p>';
		}

		var headers = [T.status, T.hostname, T.tsip, T.os, T.conn, T.rx, T.tx, T.lastSeen];
		var html = '<table class="cbi-table"><tr class="cbi-table-header">' +
			headers.map(function (h) {
				return '<th class="cbi-table-cell"' + CELL + ' style="text-align:left">' + h + '</th>';
			}).join('') + '</tr>';
		peers.forEach(function (peer) {
			var color = peer.exit_node ? 'blue' : (peer.online ? 'green' : 'gray');
			var title = (peer.exit_node ? T.exitNode + ' ' : '') +
				(peer.online ? T.online : T.offline);
			var dot = '<span style="color:' + color + '" title="' + title + '">' +
				(peer.online ? '●' : '○') + '</span>';
			var host = esc(peer.hostname) + (peer.exit_node_option ? ' (ExNode)' : '');
			html += '<tr class="cbi-rowstyle-1">' +
				'<td' + CELL + '>' + dot + '</td>' +
				'<td' + CELL + '><strong>' + host + '</strong></td>' +
				'<td' + CELL + '>' + (peer.ip || T.na) + '</td>' +
				'<td' + CELL + '>' + (esc(peer.ostype) || T.na) + '</td>' +
				'<td' + CELL + '>' + esc(formatConnectionInfo(peer.linkadress)) + '</td>' +
				'<td' + CELL + '>' + formatBytes(peer.rx) + '</td>' +
				'<td' + CELL + '>' + formatBytes(peer.tx) + '</td>' +
				'<td' + CELL + '>' + formatLastSeen(peer.lastseen) + '</td></tr>';
		});
		return html + '</table>';
	}

	function bindButtons() {
		var form = document.querySelector('form');
		if (!form) return;
		form.addEventListener('click', function (ev) {
			if (/\._setup_firewall$/.test(ev.target.id || '')) {
				ev.preventDefault();
				var fwBtn = ev.target;
				fwBtn.disabled = true;
				XHR.get(URL_FW, null, function (x, res) {
					fwBtn.disabled = false;
					if (res && res.message) alert(res.message);
					else if (res && res.error) alert(res.error);
				});
			}
		});
	}

	initRegionMap();
	bindButtons();

	XHR.poll(5, URL_STATUS, null, function (x, res) {
		var view = document.getElementById('service_status_display');
		if (view && res) view.innerHTML = renderStatus(res);
		var devView = document.getElementById('ts_devices_panel');
		if (devView && res) devView.innerHTML = renderDevices(res);
	});
})();
//]]>
</script>
<% else %>
<div class="cbi-value<% if self.error and self.error[section] then %> cbi-value-error<% end %><% if self.last_child then %> cbi-value-last<% end %>" id="cbi-<%=self.config.."-"..section.."-"..self.option%>" data-index="<%=self.index%>" data-depends="<%=pcdata(self:deplist2json(section))%>">
	<%- if self.title and #self.title > 0 then -%>
	<% if self.cast == "table" then %>
	<label class="cbi-value-title"<%= attr("for", cbid .. ".1") %>>
	<% else %>
	<div class="cbi-value-title">
	<% end %>
	<%- if self.titleref then -%><a title="<%=self.titledesc or translate('Go to relevant configuration page')%>" class="cbi-title-ref" href="<%=self.titleref%>"><%- end -%>
		<%-=self.title-%>
	<%- if self.titleref then -%></a><%- end -%>
	<% if self.cast == "table" then %></label><% else %></div><% end %>
		<div class="cbi-value-field">
	<%- end -%>
<% if self.cast == "table" then %>
<div<%=
	attr("data-prefix", cbid) ..
	attr("data-browser-path", self.default_path) ..
	attr("data-dynlist", luci.util.serialize_json({
		self.keylist, self.vallist,
		self.datatype, self.optional or self.rmempty
	})) ..
	ifattr(self.size, "data-size", self.size) ..
	ifattr(self.placeholder, "data-placeholder", self.placeholder)
%>>
<%
	local vals = self:cfgvalue(section) or {}
	for i=1, #vals + 1 do
		local val = vals[i]
		if (val and #val > 0) or (i == 1) then
%>
	<input class="cbi-input-text" value="<%=pcdata(val)%>" data-update="change" type="text"<%=
		attr("id", cbid .. "." .. i) ..
		attr("name", cbid) ..
		ifattr(self.size, "size") ..
		ifattr(i == 1 and self.placeholder, "placeholder", self.placeholder)
	%> /><br />
<% end end %>
</div>
<% else %>
<% if self.href then %><a href="<%=self.href%>"><% end -%>
	<%
		local val = self:cfgvalue(section) or self.default or ""
		if not self.rawhtml then
			write(pcdata(val))
		else
			write(val)
		end
	%>
<%- if self.href then %></a><%end%>
<input type="hidden" id="<%=cbid%>" value="<%=pcdata(self:cfgvalue(section) or self.default or "")%>" />
<% end %>
<%+cbi/valuefooter%>
<% end %>
