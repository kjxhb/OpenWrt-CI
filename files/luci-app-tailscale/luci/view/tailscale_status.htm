<%+header%>
<h2>Tailscale Status</h2>
<pre style="white-space:pre-wrap; word-wrap:break-word;">
<%=
    local util = require "luci.util"
    local out = util.exec("/usr/sbin/tailscale status --json 2>/dev/null")
    if not out or out == "" then
        out = "No status output"
    end
    luci.util.htmlescape(out)
%>
</pre>
<p>
  <a href="/admin/services/tailscale">Back to Settings</a> |
  <a href="/admin/services/tailscale/log">View Logs</a>
</p>
<%+footer%>
