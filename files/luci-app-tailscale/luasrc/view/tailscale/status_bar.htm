<div class="cbi-section" id="status_bar">
	<p id="service_status"><%=translate("Collecting data ...")%></p>
</div>

<script type="text/javascript">//<![CDATA[
(function () {
	var URL_PROC = '<%=luci.dispatcher.build_url("admin", "vpn", "tailscale", "proc")%>';
	var URL_STATUS = '<%=luci.dispatcher.build_url("admin", "vpn", "tailscale", "status")%>';
	var URL_LOGOUT = '<%=luci.dispatcher.build_url("admin", "vpn", "tailscale", "logout")%>';
	var T = {
		tailscale: '<%=translate("Tailscale")%>',
		running: '<%=translate("RUNNING")%>',
		notRunning: '<%=translate("NOT RUNNING")%>',
		needLogin: '<%=translate("Need to log in")%>',
		logout: '<%=translate("Log out and Unbind")%>',
		confirmLogout: '<%=translate("Are you sure you want to log out and unbind the current device?")%>'
	};

	function renderStatus(running) {
		var color = running ? 'green' : 'red';
		var state = running ? T.running : T.notRunning;
		return '<em><span style="color:' + color + '"><strong>' +
			T.tailscale + ' ' + state + '</strong></span></em>';
	}

	function renderLogin(backendState, authURL, displayName) {
		if (backendState === 'NeedsLogin') {
			return '<a href="' + authURL + '" target="_blank">' + T.needLogin + '</a>';
		}
		if (backendState === 'Running') {
			var html = '<a href="https://login.tailscale.com/admin/machines" target="_blank">' +
				displayName + '</a>';
			html += '<br><a style="color:green" id="logout_button" href="#">' +
				T.logout + '</a>';
			return html;
		}
		return '<span style="color:orange">' + T.notRunning + '</span>';
	}

	function bindLogout() {
		var btn = document.getElementById('logout_button');
		if (btn) {
			btn.onclick = function (ev) {
				ev.preventDefault();
				if (confirm(T.confirmLogout)) {
					XHR.get(URL_LOGOUT, null, function () {});
				}
			};
		}
	}

	function updateLogin() {
		XHR.get(URL_STATUS, null, function (x, res) {
			var loginView = document.getElementById('login_status_div');
			if (!loginView || !res) {
				return;
			}

			var placeholder = loginView.innerHTML.indexOf('Collecting') !== -1;
			var stable = res.backendState === 'Running' ||
				res.backendState === 'NeedsLogin';
			if (res.isRunning && !stable && !placeholder) {
				return;
			}
			loginView.innerHTML = renderLogin(
				res.backendState, res.authURL, res.displayName);
			bindLogout();
		});
	}

	XHR.poll(1, URL_PROC, null, function (x, res) {
		if (!res) {
			return;
		}

		var serviceView = document.getElementById('service_status');
		if (serviceView) {
			serviceView.innerHTML = renderStatus(res.running);
		}

		var loginView = document.getElementById('login_status_div');
		if (!loginView) {
			return;
		}

		if (!res.running) {
			loginView.innerHTML =
				'<span style="color:orange">' + T.notRunning + '</span>';
			return;
		}

		updateLogin();
	});
})();
//]]></script>
