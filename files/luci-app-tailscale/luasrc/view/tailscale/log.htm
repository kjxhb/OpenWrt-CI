<%+header%>

<div id="content_syslog">
	<div style="padding-bottom: 20px">
		<button id="scrollDownButton" class="cbi-button cbi-button-neutral" type="button">
			<%=translate("Scroll to tail")%>
		</button>
	</div>
	<textarea id="syslog" style="font-size:12px" readonly="readonly" wrap="off" rows="2"></textarea>
	<div style="padding-bottom: 20px">
		<button id="scrollUpButton" class="cbi-button cbi-button-neutral" type="button">
			<%=translate("Scroll to head")%>
		</button>
	</div>
</div>

<script type="text/javascript">//<![CDATA[
(function () {
	var URL_LOGDATA = '<%=luci.dispatcher.build_url("admin", "vpn", "tailscale", "logdata")%>';

	var downBtn = document.getElementById('scrollDownButton');
	var upBtn = document.getElementById('scrollUpButton');
	if (downBtn) {
		downBtn.onclick = function () {
			if (upBtn) {
				upBtn.scrollIntoView();
			}
		};
	}
	if (upBtn) {
		upBtn.onclick = function () {
			if (downBtn) {
				downBtn.scrollIntoView();
			}
		};
	}

	XHR.poll(1, URL_LOGDATA, null, function (x, data) {
		var element = document.getElementById('syslog');
		if (element && data) {
			element.value = data.value;
			element.rows = data.rows;
		}
	});
})();
//]]></script>

<%+footer%>
