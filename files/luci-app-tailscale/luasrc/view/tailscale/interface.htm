<%+header%>

<div class="cbi-map">
	<h2 name="content"><%=translate("Tailscale")%></h2>
	<div class="cbi-map-descr"><%=translate("Tailscale is a cross-platform and easy to use virtual LAN.")%></div>
	<div id="iface_container"></div>
</div>

<script type="text/javascript">//<![CDATA[
(function () {
	var URL_IFACE = '<%=luci.dispatcher.build_url("admin", "vpn", "tailscale", "iface")%>';
	var T = {
		noIface: '<%=translate("No interface online.")%>',
		ifaceInfo: '<%=translate("Network Interface Information")%>',
		ifaceName: '<%=translate("Interface Name")%>',
		ipv4: '<%=translate("IPv4 Address")%>',
		ipv6: '<%=translate("IPv6 Address")%>',
		mtu: '<%=translate("MTU")%>',
		rx: '<%=translate("Total Download")%>',
		tx: '<%=translate("Total Upload")%>'
	};

	function renderIface(data) {
		if (!data || data.length === 0) {
			return '<div>' + T.noIface + '</div>';
		}

		var html = '<table class="table">';
		html += '<tr><th class="th" colspan="2">' + T.ifaceInfo + '</th></tr>';

		var rows = [
			[T.ifaceName, 'name'],
			[T.ipv4, 'ipv4'],
			[T.ipv6, 'ipv6'],
			[T.mtu, 'mtu'],
			[T.rx, 'rxBytes'],
			[T.tx, 'txBytes']
		];

		for (var i = 0; i < data.length; i++) {
			for (var j = 0; j < rows.length; j++) {
				html += '<tr class="tr">' +
					'<td class="td left" width="25%">' + rows[j][0] + '</td>' +
					'<td class="td left" width="25%">' +
					(data[i][rows[j][1]] || '') + '</td></tr>';
			}
		}

		html += '</table>';
		return html;
	}

	XHR.poll(1, URL_IFACE, null, function (x, data) {
		var container = document.getElementById('iface_container');
		if (container) {
			container.innerHTML = renderIface(data);
		}
	});
})();
//]]></script>

<%+footer%>
